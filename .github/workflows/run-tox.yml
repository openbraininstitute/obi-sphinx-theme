name: Run tox

on:
  pull_request:

jobs:
  check:
    name: Run tox (${{ matrix.tox-env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            tox-env: py311
          - python-version: "3.12"
            tox-env: py312
          - python-version: "3.13"
            tox-env: py313
          - python-version: "3.14"
            tox-env: py314
          - python-version: "3.13"
            tox-env: lint,docs,check-packaging
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: python -m pip install "tox>=4.20,<5"
      - name: Run tox
        run: tox -e ${{ matrix.tox-env }}
