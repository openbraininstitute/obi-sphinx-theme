[build-system]
requires = ["setuptools>=80", "setuptools-scm>=9.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.black]
exclude = '''
/(
    \.eggs/
  | \.git/
  | \.hg/
  | \.mypy_cache/
  | \.tox/
  | \.venv/
  | _build/
  | buck-out/
  | build/
  | dist/

  # OBI Sphinx theme specific
  | mkdocs-material/
  | venv/

  # exclude version.py since it is generated by setuptools_scm
  | version\.py
)
'''
