[base]
deps =
    pytest>=8.3,<10
    setuptools==80.9.0
build_docs =
    make -C doc clean
    make -C doc html SPHINXOPTS=-Wv
allowlist_externals =
    make
black_version = 26.3.0
paths_to_lint =
    ci/check-regressions.py \
    mkdocs2sphinx \
    setup.py \
    obi_sphinx_theme \
    tests \
    translate_templates.py

[tox]
minversion = 4.20
ignore_basepython_conflict = true
envlist =
    lint
    docs
    check-packaging
    py{311,312,313,314}

[testenv]
# we skip the install initially so as to build an up-to-date version
skip_install = true
deps =
    {[base]deps}
setenv =
    LC_ALL=en_US.utf-8
    LANG=en_US.utf-8
# ensure the package is up-to-date
commands_pre =
    python {toxinidir}/translate_templates.py
    python -m pip install {toxinidir}
commands =
    pytest tests
    {[base]build_docs}
    python ci/check-regressions.py
allowlist_externals =
    {[base]allowlist_externals}

[testenv:lint]
deps =
    {[base]deps}
    pycodestyle>=2.14,<3
    pydocstyle>=6.3,<7
    pylint>=3.3,<4
    black=={[base]black_version}
    sphinx>=8.2,<10
commands =
    pycodestyle {[base]paths_to_lint}
    pydocstyle {[base]paths_to_lint}
    pylint {[base]paths_to_lint} doc/source/conf.py
    black . --check -v

[testenv:coverage]
deps =
    {[base]deps}
    coverage>=7.6,<8
commands =
    coverage run --source obi_sphinx_theme,mkdocs2sphinx -m pytest tests/
    coverage report --show-missing
    coverage xml
    coverage html

[testenv:docs]
commands =
    {[base]build_docs}

[testenv:check-packaging]
deps =
    build>=1.2,<2
    twine>=6,<7
commands =
    python -m build --sdist --outdir {envtmpdir}/dist
    twine check {envtmpdir}/dist/*

[testenv:format]
deps =
    black=={[base]black_version}
commands = black . -v
